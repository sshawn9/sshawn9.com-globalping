name: Globalping

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      state_run_id:
        description: Source Run ID (digits after /actions/runs/); blank starts from zero
        type: string
        default: ''
      CN-main:
        description: CN-main
        type: boolean
        default: true
      CN-aroung:
        description: CN-aroung
        type: boolean
        default: false
      global-main:
        description: global-main
        type: boolean
        default: false
      max_parallel:
        description: Maximum concurrent probe runners
        type: number
        default: 12
        required: true
      max_rounds:
        description: Maximum rounds for this task, including its first round
        type: number
        default: 5
        required: true

permissions:
  contents: read
  actions: write

jobs:
  execute:
    uses: ./.github/workflows/execute-probe-plan.yml
    with:
      state_run_id: ${{ inputs.state_run_id || '' }}
      definition: probe/plans/globalping.mjs
      settings: ${{ toJSON(inputs) }}
